<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-card">
        <h2>Đăng nhập</h2>
        <div class="alert error" th:if="${param.error}">
            <p style="color:red">
                Username/email hoặc password không đúng
            </p>
        </div>
        <div class="alert success" th:if="${param.logout}">
            <p style="color:green">
                Bạn đã đăng xuất
            </p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-grid">
                <label>Username hoặc Email</label>
                <input type="text" name="username" placeholder="Username hoặc email" required autofocus>
            </div>
            <div class="form-grid">
                <label>Password</label>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button class="btn primary full mt" type="submit">Đăng nhập</button>
        </form>
    </div>
</main>
</body>
</html>
