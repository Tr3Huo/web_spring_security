<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Trang chủ')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <h1>Bảng điều khiển</h1>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div class="cards">
        <div class="card"><h3>Tổng số Người dùng</h3><strong th:text="${userCount}">0</strong></div>
        <div class="card"><h3>Tổng số Sản phẩm</h3><strong th:text="${productCount}">0</strong></div>
    </div>
    <div class="quick-links">
        <a class="button" th:href="@{/products}">Quản lý Sản phẩm</a>
        <a class="button" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/users}">Quản lý Người dùng</a>
    </div>
</main>
</div>
</body>
</html>
