<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">
            IOTSTAR SHOP
        </a>
    </div>

    <div class="account" sec:authorize="isAuthenticated()">
        <!-- Avatar -->
        <img th:src="${#authentication.principal.images != null 
                        and !#strings.isEmpty(#authentication.principal.images) 
                        ? #authentication.principal.images 
                        : '/images/avatar-default.png'}" 
             alt="Avatar" width="40" height="40" style="border-radius:50%; object-fit:cover;">

        <!-- Full name -->
        <span th:text="${#authentication.principal.fullName}">
            Nguyễn Văn A
        </span>

        <!-- Username -->
        <span th:text="'(' + ${#authentication.principal.username} + ')'">
            (nguyenvana)
        </span>

        <!-- Email -->
        <span th:text="${#authentication.principal.email}">
            email@gmail.com
        </span>

        <!-- Role -->
        <span th:text="${#authentication.principal.role}">
            ROLE_USER
        </span>

        <!-- Logout -->
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="link-button" type="submit">
                Đăng xuất
            </button>
        </form>
    </div>

    <div th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}">
            Đăng nhập
        </a>
    </div>
</header>
</body>
</html>
